# Installs dependencies with pnpm, builds the TypeScript sources and runs the
# tests across several Node.js versions, plus a job that guards the quality of
# the published types and packaging.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  build:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

  types:
    name: Types and packaging
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Typecheck sources and tests
        run: pnpm run typecheck
      # `are-the-types-wrong` and `publint` inspect the packed tarballs, so the
      # packages have to be built first.
      - name: Check published types and packaging
        run: pnpm run check:exports

  bench:
    name: Benchmarks
    # Benchmarking both sides of a pull request doubles the run and the numbers
    # only mean something when somebody is reading them, so the job waits for
    # the `perf` label. Add it to a pull request to get the comparison, and
    # push again (or re-run the job) to refresh it.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf')
    timeout-minutes: 20
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # How much slower a benchmark has to get, in percent of its median time,
      # before this job fails. A shared runner is noisy enough that a tighter
      # threshold would report nothing but noise; see scripts/compare-bench.mjs
      # for how noisy benchmarks are held back from failing on their own.
      BENCH_REGRESSION_THRESHOLD: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit is benchmarked from this same clone.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Both sides run back to back on the same runner, which is what makes the
      # comparison worth reading: the machine is the same for both halves.
      - name: Benchmark this pull request
        run: |
          echo "PR_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          pnpm run bench --reporter=json --outputFile.json="$RUNNER_TEMP/head.json"
      - name: Check out the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git checkout --force --detach "$BASE_SHA"
      - run: pnpm install --frozen-lockfile
      - name: Benchmark the base branch
        # A base branch from before a benchmark existed has nothing to report;
        # the comparison then lists that benchmark as new instead of failing.
        run: |
          pnpm run bench --reporter=json --outputFile.json="$RUNNER_TEMP/base.json" ||
            echo "::warning::The base branch produced no benchmark report."
      - name: Restore this pull request
        run: git checkout --force --detach "$PR_COMMIT"
      - name: Compare the two runs
        run: |
          pnpm run bench:compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"

  automerge:
    name: Automerge Dependabot pull request
    # Only Dependabot's own pull requests are eligible. `github.event.pull_request.user.login`
    # is used instead of `github.actor`, because the latter reports whoever last triggered the
    # run (a rerun or a push to the branch), and so can be spoofed into passing this check.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs: [build, types]
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      # `contents: write` performs the merge itself, `pull-requests: write` approves the
      # pull request beforehand, since the merge is rejected without a review approval.
      contents: write
      pull-requests: write

    steps:
      # Approves and squash-merges the pull request. Merging is gated on this job's `needs`,
      # and further on whatever checks branch protection requires, because the merge goes
      # through the GitHub API and is refused while a required check is missing or red.
      #
      # Landing a Dependabot pull request on `main` publishes nothing: these branches carry
      # no changeset, so the release workflow finds no version to bump and `changeset
      # publish` has nothing left to release.
      - uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
