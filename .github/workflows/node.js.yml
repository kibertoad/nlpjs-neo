# Installs dependencies with pnpm, builds the TypeScript sources and runs the
# tests across several Node.js versions, plus a job that guards the quality of
# the published types and packaging.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      # The `mongodb-adapter` tests run against a real `mongod`, which
      # `mongodb-memory-server` downloads from its install script. Where it puts
      # the binary otherwise depends on how it was installed, so the directory
      # is pinned before the install runs and the cache is keyed on it.
      - name: Pin the mongod download directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

  types:
    name: Types and packaging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Pin the mongod download directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Typecheck sources and tests
        run: pnpm run typecheck
      # `are-the-types-wrong` and `publint` inspect the packed tarballs, so the
      # packages have to be built first.
      - name: Check published types and packaging
        run: pnpm run check:exports
