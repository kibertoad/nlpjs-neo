# Audits this repository's GitHub Actions configuration (workflows, composite
# actions and the Dependabot config) with zizmor, a static analyzer for Actions
# supply-chain and permission problems.
#
# Results are reported as inline annotations on the pull request diff rather
# than uploaded to code scanning, and any finding fails this job, so a pull
# request that introduces a workflow security issue is blocked until it is
# fixed. Inline mode means no `security-events` permission and no GitHub
# Advanced Security subscription are needed.

name: zizmor

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  zizmor:
    name: Audit GitHub Actions configuration
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      # Read-only access is all zizmor needs: `contents` to check out this
      # repository and to resolve the actions referenced by its workflows
      # during the online audits.
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # `annotations` requires `advanced-security` to be turned off
          # explicitly; together they select the inline, blocking mode.
          advanced-security: false
          annotations: true
